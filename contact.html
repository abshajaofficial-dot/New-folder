<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Hello, World!" />
    <title>Contact | Hello, World!</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; } * { box-sizing: border-box; }
      body { display:grid; min-height:100vh; margin:0; padding:2rem; place-items:center; color:#f8f7ff; background:#0b1020; }
      .orb { position:fixed; width:32rem; aspect-ratio:1; border-radius:50%; filter:blur(18px); opacity:.48; pointer-events:none; } .orb--pink { top:-14rem; left:-10rem; background:#e94b9a; } .orb--blue { right:-12rem; bottom:-15rem; background:#496bff; }
      main { position:relative; width:min(92vw,760px); padding:clamp(4.8rem,8vw,5.5rem) clamp(2rem,7vw,5.5rem); text-align:center; background:rgba(15,21,43,.68); border:1px solid rgba(255,255,255,.18); border-radius:30px; box-shadow:0 28px 80px rgba(0,0,0,.35); backdrop-filter:blur(18px); }
      nav { position:absolute; top:1.4rem; right:1.7rem; display:flex; gap:.35rem; } nav a { padding:.45rem .75rem; color:#d9ddff; font-size:.9rem; font-weight:700; text-decoration:none; border-radius:999px; } nav a:hover, nav a:focus-visible, nav a[aria-current="page"] { color:#fff; background:rgba(255,255,255,.13); outline:none; }
      .eyebrow { display:inline-block; margin-bottom:1.25rem; padding:.45rem .8rem; color:#d9ddff; font-size:.82rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; background:rgba(255,255,255,.09); border-radius:999px; } h1 { margin:0; font-size:clamp(2.8rem,8vw,5.5rem); letter-spacing:-.06em; } p { max-width:34rem; margin:1.5rem auto; color:#c6cae3; font-size:clamp(1rem,2vw,1.17rem); line-height:1.7; }
      form { display:grid; gap:.85rem; max-width:31rem; margin:2rem auto 0; text-align:left; } label { color:#d9ddff; font-size:.9rem; font-weight:700; } input, textarea { width:100%; margin-top:.35rem; padding:.8rem .9rem; color:#f8f7ff; font:inherit; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); border-radius:12px; } textarea { min-height:7rem; resize:vertical; } button { justify-self:center; margin-top:.35rem; padding:.9rem 1.3rem; color:#10152b; font:inherit; font-weight:800; cursor:pointer; background:linear-gradient(135deg,#fff,#b8c8ff); border:0; border-radius:999px; } #thanks { min-height:1.5rem; margin:.8rem 0 0; color:#aef3c8; font-weight:700; } @media (max-width:540px) { body { padding:1rem; } nav { top:1rem; right:50%; transform:translateX(50%); } }
    </style>
  </head>
  <body>
    <div class="orb orb--pink" aria-hidden="true"></div><div class="orb orb--blue" aria-hidden="true"></div>
    <main>
      <nav aria-label="Primary navigation"><a href="hello-world.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
      <div class="eyebrow">Contact</div><h1>Let’s say hello.</h1><p>Have a thought, a question, or an idea? Send a note and we’ll be delighted to hear from you.</p>
      <form id="contact-form"><label>Name<input name="name" autocomplete="name" required /></label><label>Email<input type="email" name="email" autocomplete="email" required /></label><label>Message<textarea name="message" required></textarea></label><button type="submit">Send message</button></form><p id="thanks" aria-live="polite"></p>
    </main>
    <script>document.querySelector('#contact-form').addEventListener('submit', event => { event.preventDefault(); event.currentTarget.reset(); document.querySelector('#thanks').textContent = 'Thanks for reaching out — your message is ready to send!'; });</script>
  </body>
</html>
