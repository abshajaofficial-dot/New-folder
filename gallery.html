<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A gallery of bright ideas from Hello, World!" />
    <title>Gallery | Hello, World!</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: clamp(1rem, 3vw, 2rem); color: #f8f7ff; background: #0b1020; }
      .orb { position: fixed; z-index: -1; width: 32rem; aspect-ratio: 1; border-radius: 50%; filter: blur(18px); opacity: .48; pointer-events: none; }
      .orb--pink { top: -14rem; left: -10rem; background: #e94b9a; }
      .orb--blue { right: -12rem; bottom: -15rem; background: #496bff; }
      main { width: min(100%, 1080px); min-height: calc(100vh - 4rem); margin: auto; padding: clamp(5.8rem, 8vw, 7rem) clamp(1.2rem, 5vw, 3.5rem) 3rem; background: rgba(15, 21, 43, .68); border: 1px solid rgba(255,255,255,.18); border-radius: 30px; box-shadow: 0 28px 80px rgba(0,0,0,.35); backdrop-filter: blur(18px); }
      nav { position: absolute; top: 3.4rem; right: max(2.2rem, calc((100vw - 1010px) / 2)); display: flex; gap: .35rem; }
      nav a { padding: .45rem .75rem; color: #d9ddff; font-size: .9rem; font-weight: 700; text-decoration: none; border-radius: 999px; transition: background 180ms ease, color 180ms ease; }
      nav a:hover, nav a:focus-visible, nav a[aria-current="page"] { color: #fff; background: rgba(255,255,255,.13); outline: none; }
      .intro { max-width: 42rem; margin: 0 auto 2.6rem; text-align: center; }
      .eyebrow { display: inline-block; margin-bottom: 1rem; padding: .45rem .8rem; color: #d9ddff; font-size: .82rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; background: rgba(255,255,255,.09); border-radius: 999px; }
      h1 { margin: 0; font-size: clamp(3rem, 8vw, 5.5rem); line-height: .98; letter-spacing: -.065em; }
      h1 span { color: transparent; background: linear-gradient(110deg, #fff 18%, #b9c5ff 52%, #ffb7db 90%); background-clip: text; -webkit-background-clip: text; }
      .intro p { margin: 1.2rem auto 0; color: #c6cae3; font-size: clamp(1rem, 2vw, 1.12rem); line-height: 1.65; }
      .gallery { display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: 7rem; gap: 1rem; }
      figure { position: relative; display: flex; align-items: end; min-height: 0; margin: 0; padding: 1.15rem; overflow: hidden; border: 1px solid rgba(255,255,255,.18); border-radius: 20px; box-shadow: inset 0 -5rem 4rem rgba(5, 8, 25, .35); transition: transform 220ms ease, border-color 220ms ease; }
      figure:hover { transform: translateY(-5px); border-color: rgba(255,255,255,.45); }
      figure::before, figure::after { position: absolute; content: ""; border-radius: 50%; filter: blur(2px); }
      figure::before { width: 11rem; height: 11rem; top: -3rem; right: -2rem; background: rgba(255,255,255,.3); }
      figure::after { width: 7rem; height: 7rem; bottom: -3rem; left: -1rem; background: rgba(255,255,255,.16); }
      figcaption { position: relative; z-index: 1; font-size: 1.05rem; font-weight: 800; letter-spacing: -.02em; }
      .violet { grid-column: span 5; grid-row: span 3; background: linear-gradient(135deg, #7359f5, #2e276c 70%); }
      .sunset { grid-column: span 7; grid-row: span 3; background: linear-gradient(120deg, #f47699, #ff9e68 58%, #7044d3); }
      .mint { grid-column: span 4; grid-row: span 2; background: linear-gradient(135deg, #1f9e9a, #9ee8b2); }
      .midnight { grid-column: span 4; grid-row: span 2; background: linear-gradient(135deg, #19295d, #3d6df0); }
      .peach { grid-column: span 4; grid-row: span 2; background: linear-gradient(135deg, #f5b074, #df5c8c); }
      .peach::before { background: rgba(255,239,188,.45); }
      @media (max-width: 650px) { body { padding: 1rem; } main { min-height: calc(100vh - 2rem); padding-top: 7rem; } nav { top: 2rem; right: 50%; transform: translateX(50%); } .gallery { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 8rem; } .violet, .sunset { grid-column: span 2; grid-row: span 2; } .mint, .midnight, .peach { grid-column: span 2; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div class="orb orb--pink" aria-hidden="true"></div><div class="orb orb--blue" aria-hidden="true"></div>
    <main>
      <nav aria-label="Primary navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html" aria-current="page">Gallery</a><a href="contact.html">Contact</a></nav>
      <section class="intro" aria-labelledby="gallery-title">
        <div class="eyebrow">A little inspiration</div>
        <h1 id="gallery-title">Made with <span>possibility.</span></h1>
        <p>A collection of color, energy, and small sparks that make new ideas feel within reach.</p>
      </section>
      <section class="gallery" aria-label="Inspiration gallery">
        <figure class="violet"><figcaption>Afterglow</figcaption></figure>
        <figure class="sunset"><figcaption>New horizons</figcaption></figure>
        <figure class="mint"><figcaption>Fresh perspective</figcaption></figure>
        <figure class="midnight"><figcaption>Night ideas</figcaption></figure>
        <figure class="peach"><figcaption>Warm welcome</figcaption></figure>
      </section>
    </main>
  </body>
</html>
