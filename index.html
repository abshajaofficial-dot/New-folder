<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A polished welcome page." />
    <title>Home | Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        place-items: center;
        color: #f8f7ff;
        background: #0b1020;
      }

      .orb {
        position: fixed;
        width: 32rem;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(18px);
        opacity: 0.48;
        animation: drift 12s ease-in-out infinite alternate;
      }

      .orb--pink { top: -14rem; left: -10rem; background: #e94b9a; }
      .orb--blue { right: -12rem; bottom: -15rem; background: #496bff; animation-delay: -5s; }

      main {
        position: relative;
        width: min(92vw, 760px);
        padding: clamp(2rem, 7vw, 5.5rem);
        text-align: center;
        background: rgba(15, 21, 43, 0.68);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 30px;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
        animation: enter 700ms cubic-bezier(.2,.9,.2,1) both;
      }

      nav {
        position: absolute;
        top: 1.4rem;
        right: 1.7rem;
        display: flex;
        gap: 0.35rem;
      }

      nav a {
        padding: 0.45rem 0.75rem;
        color: #d9ddff;
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
        border-radius: 999px;
        transition: background 180ms ease, color 180ms ease;
      }

      nav a:hover, nav a:focus-visible, nav a[aria-current="page"] {
        color: #fff;
        background: rgba(255, 255, 255, 0.13);
        outline: none;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        margin: 0 0 1.35rem;
        padding: 0.45rem 0.8rem;
        color: #d9ddff;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        background: rgba(255, 255, 255, 0.09);
        border-radius: 999px;
      }

      .eyebrow::before {
        width: 0.55rem;
        height: 0.55rem;
        content: "";
        background: #7dffbc;
        border-radius: 50%;
        box-shadow: 0 0 14px #7dffbc;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 10vw, 6.8rem);
        line-height: 0.95;
        letter-spacing: -0.07em;
      }

      h1 span {
        color: transparent;
        background: linear-gradient(110deg, #ffffff 18%, #b9c5ff 52%, #ffb7db 90%);
        background-clip: text;
        -webkit-background-clip: text;
      }

      p {
        max-width: 35rem;
        margin: 1.7rem auto 2.2rem;
        color: #c6cae3;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.65;
      }

      button {
        padding: 0.9rem 1.25rem;
        color: #10152b;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        background: linear-gradient(135deg, #ffffff, #b8c8ff);
        border: 0;
        border-radius: 999px;
        box-shadow: 0 12px 28px rgba(97, 125, 255, 0.3);
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      button:hover { transform: translateY(-3px); box-shadow: 0 17px 32px rgba(97, 125, 255, 0.42); }
      button:focus-visible { outline: 3px solid #ffb7db; outline-offset: 4px; }

      @keyframes enter {
        from { opacity: 0; transform: translateY(22px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes drift {
        to { transform: translate(4rem, 3rem) scale(1.12); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }

      @media (max-width: 540px) {
        main { padding-top: 5.25rem; }
        nav { top: 1rem; right: 50%; transform: translateX(50%); }
      }
    </style>
  </head>
  <body>
    <div class="orb orb--pink" aria-hidden="true"></div>
    <div class="orb orb--blue" aria-hidden="true"></div>
    <main>
      <nav aria-label="Primary navigation">
        <a href="index.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="eyebrow">Ready to begin</div>
      <h1>Hello, <span>World!</span></h1>
      <p>A small first step, beautifully made. Your next great idea can start right here.</p>
      <button type="button" id="hello-button">Say hello back</button>
    </main>
    <script>
      const button = document.querySelector("#hello-button");
      button.addEventListener("click", () => {
        button.textContent = "Hello to you too! ✨";
      });
    </script>
  </body>
</html>
